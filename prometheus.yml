global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'deepiri-monitor'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # API Service metrics
  - job_name: 'api-service'
    static_configs:
      - targets: ['api:5006']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Worker Service metrics
  - job_name: 'worker-service'
    static_configs:
      - targets: ['worker:5007']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
